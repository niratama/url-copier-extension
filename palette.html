<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>URL Copier</title>
    <style>
        :root {
            color-scheme: light;
            --surface: #ffffff;
            --surface-muted: #e6e6e6;
            --surface-tab: #f0f0f0;
            --border: #c9c9c9;
            --text: #2c241e;
            --muted: #6f6257;
            --accent: #9b5827;
            --accent-soft: #f7e9dc;
            --shadow: 0 10px 24px rgba(56, 38, 20, 0.10);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
            color: var(--text);
            background: transparent;
            overflow: hidden;
        }

        .panel {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .actions {
            display: flex;
            align-items: flex-end;
            gap: 0;
            background: var(--surface-muted);
            border-bottom: 1px solid var(--border);
        }

        .tabs {
            display: flex;
            align-items: flex-end;
            gap: 0;
            flex: 1 1 auto;
        }

        .tab {
            border: 1px solid var(--border);
            border-bottom: 0;
            border-radius: 10px 10px 0 0;
            background: var(--surface-muted);
            color: var(--text);
            padding: 8px 14px 9px;
            min-width: 118px;
            margin-right: -1px;
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            top: 1px;
        }

        .tab:hover,
        .tab:focus-visible {
            background: #dedede;
            outline: none;
        }

        .tab.active {
            z-index: 1;
            background: var(--surface);
            border-bottom: 1px solid var(--surface);
            margin-bottom: -1px;
        }

        .action {
            margin: 0 8px 8px 8px;
            border: 1px solid #bcbcbc;
            border-radius: 8px;
            background: linear-gradient(180deg, #ffffff, #efefef);
            color: #444;
            padding: 7px 12px 8px;
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.8) inset;
        }

        .action:hover,
        .action:focus-visible {
            background: linear-gradient(180deg, #ffffff, #e7e7e7);
            outline: none;
        }

        .list {
            min-height: 0;
            padding: 4px;
            overflow: auto;
            background: var(--surface);
        }

        .item {
            width: 100%;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 8px;
            margin: 1px 0;
            cursor: pointer;
            text-align: left;
            transition: background-color 120ms ease;
        }

        .item:hover,
        .item.selected {
            background: var(--accent-soft);
        }

        .item:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        .key {
            width: 22px;
            height: 22px;
            border-radius: 7px;
            display: grid;
            place-items: center;
            flex: 0 0 auto;
            background: rgba(155, 88, 39, 0.12);
            color: var(--accent);
            font-size: 11px;
            font-weight: 700;
        }

        .name {
            flex: 0 0 auto;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .format {
            flex: 1 1 auto;
            font-size: 12px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty {
            margin: 4px 6px;
            padding: 8px 10px;
            border-radius: 8px;
            background: rgba(155, 88, 39, 0.08);
            color: var(--muted);
            font-size: 12px;
            line-height: 1.45;
        }
    </style>
</head>
<body>
    <main class="panel" aria-label="URL Copier palette">
        <div class="actions">
            <div id="copy-target-tabs" class="tabs" role="tablist" aria-label="Select copy target">
                <button id="current-tab-btn" class="tab" type="button" role="tab" aria-selected="true">現在のタブをコピー</button>
                <button id="all-tabs-btn" class="tab" type="button" role="tab" aria-selected="false">すべてのタブ</button>
            </div>
            <button id="options-btn" class="action" type="button">オプション</button>
        </div>
        <div id="palette-list" class="list" role="listbox" aria-label="Template list"></div>
        <div id="palette-message" class="empty" hidden></div>
    </main>
    <script src="constants.js"></script>
    <script src="palette.js"></script>
</body>
</html>
